[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piast-gate"
version = "0.1.0"
description = "Privacy-first LLM gateway — anonymize PII before it leaves your system."
readme = "README.md"
license = "GPL-3.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.128.0",
    "torch==2.13.0",
    "transformers==5.14.1",
    "google-genai==1.56.0",
    "phonenumbers==9.0.21",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "python-dotenv==1.2.1",
    "slowapi==0.1.9",
    "uvicorn==0.40.0",
    "python-multipart==0.0.22",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest-cov",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "B", "I"]
ignore = []

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "domain*", "application*", "infrastructure*"]
